[project]
name = "easyaivideo"
version = "0.1.0"
description = "EasyAIVideo - AI short video generation platform (topic -> script -> images + voice -> video)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "edge-tts>=7.0.0",
    "pillow>=10.1.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
]

[project.scripts]
easyaivideo = "easyaivideo.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easyaivideo"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
